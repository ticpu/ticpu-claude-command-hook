# /etc/systemd/system/ollama.service.d/tuning.conf
#
# The design-rationale judge talks to a local ollama. Only OLLAMA_CONTEXT_LENGTH below is
# required; the rest is sizing for one card and should be recomputed for yours.
#
# Sized for an RTX 5070 Ti (GB203, 16303 MiB, compute 12.0). Ollama's own defaults assume an
# unknown GPU.
[Service]

# Flash attention: supported on Blackwell, cuts KV-cache VRAM and speeds up long prompts.
# Off by default in ollama. Also a prerequisite for KV quantization.
Environment=OLLAMA_FLASH_ATTENTION=1

# Quantize the KV cache to 8-bit: halves KV VRAM for negligible quality loss. q4_0 halves it
# again but degrades long-context recall noticeably; don't.
Environment=OLLAMA_KV_CACHE_TYPE=q8_0

# Pin the default context. The VRAM-based guess picked 4k on this card, which silently
# truncates any prompt carrying a file — the model then answers off the surviving fragment
# instead of reporting that it could not see the input. The judge states num_ctx on every
# request anyway, so this covers everything else on the box.
Environment=OLLAMA_CONTEXT_LENGTH=32768

# Two resident models, not ollama's auto default: the judge runs behind an editor hook while
# a chat model is in use, and evicting one per hook call would cost a reload apiece.
Environment=OLLAMA_MAX_LOADED_MODELS=2

# One request in flight per model. Parallel slots SPLIT the context between them, so leaving
# this on auto quietly divides the value above.
Environment=OLLAMA_NUM_PARALLEL=1

# Reserve VRAM ollama must not plan for: a display client shares this GPU and its usage
# fluctuates after model load.
Environment=OLLAMA_GPU_OVERHEAD=1073741824

# Keep models resident between calls. An editor hook fires in bursts separated by minutes of
# typing, and the default expires mid-session. Not -1, so the GPU eventually frees up.
Environment=OLLAMA_KEEP_ALIVE=30m

# CUDA-only for the dGPU. Skip the Vulkan discovery pass so the same card cannot be
# enumerated twice by two backends.
Environment=OLLAMA_VULKAN=0
