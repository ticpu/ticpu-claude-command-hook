[package]
name = "ticpu-claude-command-hook"
version = "0.1.0"
edition = "2021"
description = "Single-binary Claude Code hook dispatcher for PreToolUse/PostToolUse guards"
license = "GPL-3.0-only"
repository = "https://github.com/ticpu/ticpu-claude-command-hook"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
