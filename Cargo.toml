[package]
name = "ticpu-claude-command-hook"
version = "0.6.0"
edition = "2021"
description = "Single-binary Claude Code hook dispatcher for PreToolUse/PostToolUse guards"
license = "GPL-3.0-only"
repository = "https://github.com/ticpu/ticpu-claude-command-hook"
authors = ["Jérôme Poulin <jeromepoulin@gmail.com>"]

[dependencies]
anyhow = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"

[dev-dependencies]
landlock-test-confine = "0.5"

[profile.release]
strip = true
