title = "ticpu-claude-command-hook gitleaks config"

# Without this the rules below *replace* the built-in secret rules instead of
# adding to them, and every key/token gitleaks ships a rule for goes unscanned.
[extend]
useDefault = true

# `gitleaks dir` walks build output too, where any 10-digit constant (u32::MAX,
# for one) trips the NANP rule. Nothing under here is ever committed.
[[allowlists]]
paths = ['''target/''']

# The release key's fingerprint is public by construction — the archive that
# verifies the signatures publishes it — and generic-api-key reads it as a token.
[[allowlists]]
paths = ['''sign-release\.sh''']
regexes = ['''RELEASE_KEY=[0-9A-F]{40}''']

[[rules]]
id = "phone-number-e164"
description = "E.164 phone number (North American +1XXXXXXXXXX)"
regex = '''\+1[2-9]\d{9}\b'''
tags = ["pii", "phone"]
[rules.allowlist]
regexTarget = "match"
regexes = [
  '''\+1555\d{7}''',
]

[[rules]]
id = "phone-number-nanp"
description = "NANP phone number (10 digits, no country code)"
regex = '''\b[2-9]\d{2}[2-9]\d{6}\b'''
tags = ["pii", "phone"]
[rules.allowlist]
regexTarget = "match"
regexes = [
  '''555\d{7}''',
  '''911555\d{4}''',
]

[[rules]]
id = "phone-number-parens"
description = "Phone number with parentheses (XXX) XXX-XXXX"
regex = '''\([2-9]\d{2}\)\s?\d{3}-\d{4}'''
tags = ["pii", "phone"]
[rules.allowlist]
regexTarget = "match"
regexes = [
  '''\(555\)''',
]
